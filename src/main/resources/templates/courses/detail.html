<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Chi tiết khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <a th:href="@{/courses}">&larr; Danh sách</a>
  <h3 class="mt-2" th:text="${course.name}"></h3>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <ul>
    <li>Loại: <b th:text="${course.courseCategory.name}"></b></li>
    <li>Học phí: <b th:text="${#numbers.formatDecimal(course.tuitionFee,1,'POINT',0,'COMMA')} + ' đ'"></b></li>
    <li>Thời lượng: <b th:text="${course.duration} + ' giờ (' + ${course.durationType} + ')'"></b></li>
    <li>Trạng thái: <b th:text="${course.active} ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'"></b></li>
    <li>Mô tả: <span th:text="${course.description}"></span></li>
  </ul>

  <h5>Hình ảnh</h5>
  <p class="text-muted" th:if="${#lists.isEmpty(course.images)}">Khóa học này chưa có ảnh.</p>
  <div class="row">
    <div class="col-md-3 mb-3" th:each="img : ${course.images}">
      <div class="card">
        <img th:src="${img.imageUrl}" class="card-img-top">
        <div class="card-body p-2">
          <span th:if="${img.thumbnail}" class="badge bg-warning text-dark">Ảnh đại diện</span>
          <form th:unless="${img.thumbnail}" method="post"
                th:action="@{/courses/{cid}/images/{iid}/thumbnail(cid=${course.id},iid=${img.id})}">
            <button class="btn btn-sm btn-outline-primary">Chọn làm ảnh đại diện</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <h5>Thêm ảnh bằng URL</h5>
  <form method="post" th:action="@{/courses/{id}/images(id=${course.id})}" class="row g-2">
    <div class="col-md-7"><input class="form-control" name="imageUrl" placeholder="https://..."></div>
    <div class="col-auto form-check mt-2 ms-2">
      <input class="form-check-input" type="checkbox" name="thumbnail" value="true" id="th">
      <label class="form-check-label" for="th">Đặt làm ảnh đại diện</label>
    </div>
    <div class="col-auto"><button class="btn btn-primary">Thêm ảnh</button></div>
  </form>
</body>
</html>
