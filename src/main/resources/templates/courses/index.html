<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Quản lý khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div class="d-flex justify-content-between mb-3">
    <h3>Quản lý khóa học</h3>
    <div>
      <a class="btn btn-outline-secondary" th:href="@{/categories}">Loại khóa học</a>
      <a class="btn btn-primary" th:href="@{/courses/create}">+ Thêm khóa học</a>
    </div>
  </div>

  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <form method="get" th:action="@{/courses}" class="row g-2 mb-3">
    <div class="col-md-3">
      <input class="form-control" name="keyword" placeholder="Tìm theo tên..." th:value="${keyword}">
    </div>
    <div class="col-md-2">
      <select class="form-select" name="categoryId">
        <option value="">Tất cả loại</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                th:selected="${c.id == categoryId}"></option>
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" name="status">
        <option value="">Tất cả trạng thái</option>
        <option value="active" th:selected="${status == 'active'}">Đang tuyển sinh</option>
        <option value="inactive" th:selected="${status == 'inactive'}">Ngừng tuyển sinh</option>
      </select>
    </div>
    <div class="col-md-2">
      <input class="form-control" type="number" step="any" name="minFee" placeholder="Học phí từ" th:value="${minFee}">
    </div>
    <div class="col-md-2">
      <input class="form-control" type="number" step="any" name="maxFee" placeholder="Học phí đến" th:value="${maxFee}">
    </div>
    <div class="col-md-3">
      <select class="form-select" name="sort">
        <option value="">Sắp xếp mặc định</option>
        <option value="fee_asc" th:selected="${sort == 'fee_asc'}">Học phí tăng dần</option>
        <option value="fee_desc" th:selected="${sort == 'fee_desc'}">Học phí giảm dần</option>
        <option value="duration_asc" th:selected="${sort == 'duration_asc'}">Thời lượng tăng dần</option>
      </select>
    </div>
    <div class="col-md-3">
      <button class="btn btn-success">Lọc / Tìm</button>
      <a class="btn btn-light" th:href="@{/courses}">Xóa lọc</a>
    </div>
  </form>

  <table class="table table-bordered align-middle">
    <thead class="table-light">
      <tr><th>Ảnh</th><th>Tên</th><th>Loại</th><th>Học phí</th><th>Thời lượng</th><th>Phân loại</th><th>Trạng thái</th><th></th></tr>
    </thead>
    <tbody>
      <tr th:each="c : ${courses}">
        <td style="width:110px">
          <img th:if="${c.thumbnailImage != null}" th:src="${c.thumbnailImage.imageUrl}" class="img-fluid rounded">
          <span th:unless="${c.thumbnailImage != null}" class="text-muted small">Chưa có ảnh</span>
        </td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.courseCategory.name}"></td>
        <td th:text="${#numbers.formatDecimal(c.tuitionFee,1,'POINT',0,'COMMA')} + ' đ'"></td>
        <td th:text="${c.duration} + ' giờ'"></td>
        <td><span class="badge bg-info text-dark" th:text="${c.durationType}"></span></td>
        <td>
          <span th:if="${c.active}" class="badge bg-success">Đang tuyển sinh</span>
          <span th:unless="${c.active}" class="badge bg-secondary">Ngừng tuyển sinh</span>
        </td>
        <td>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/courses/{id}(id=${c.id})}">Chi tiết</a>
          <a class="btn btn-sm btn-outline-warning" th:href="@{/courses/{id}/edit(id=${c.id})}">Sửa</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(courses)}">
        <td colspan="8" class="text-center text-muted">Không tìm thấy khóa học nào phù hợp</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
