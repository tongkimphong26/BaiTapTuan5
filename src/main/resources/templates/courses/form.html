<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title th:text="${title}">Khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width:700px">
  <h3 th:text="${title}"></h3>
  <form method="post" th:object="${form}"
        th:action="${form.id == null} ? @{/courses/create} : @{/courses/{id}/edit(id=${form.id})}">

    <div class="mb-3">
      <label class="form-label">Tên khóa học</label>
      <input class="form-control" th:field="*{name}">
      <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Học phí</label>
      <input class="form-control" type="number" step="any" th:field="*{tuitionFee}">
      <div class="text-danger" th:if="${#fields.hasErrors('tuitionFee')}" th:errors="*{tuitionFee}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Thời lượng (giờ)</label>
      <input class="form-control" type="number" th:field="*{duration}">
      <div class="text-danger" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Loại khóa học</label>
      <select class="form-select" th:field="*{categoryId}">
        <option value="">-- Chọn loại --</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>
      <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Mô tả</label>
      <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-check-label"><input class="form-check-input me-2" type="checkbox" th:field="*{active}">Đang tuyển sinh</label>
    </div>

    <button class="btn btn-primary">Lưu</button>
    <a class="btn btn-light" th:href="@{/courses}">Quay lại</a>
  </form>
</body>
</html>
