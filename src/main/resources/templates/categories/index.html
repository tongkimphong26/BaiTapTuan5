<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Loại khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width:800px">
  <a th:href="@{/courses}">&larr; Danh sách khóa học</a>
  <h3 class="mt-2">Loại khóa học</h3>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <table class="table table-bordered">
    <thead class="table-light"><tr><th>Id</th><th>Tên</th><th>Số khóa học</th><th></th></tr></thead>
    <tbody>
      <tr th:each="c : ${categories}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${#lists.size(c.courses)}"></td>
        <td>
          <form method="post" th:action="@{/categories/{id}/delete(id=${c.id})}"
                onsubmit="return confirm('Xóa loại khóa học này?')">
            <button class="btn btn-sm btn-danger">Xóa</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <h5>Thêm loại mới</h5>
  <form method="post" th:action="@{/categories}" th:object="${category}" class="row g-2">
    <div class="col-md-4">
      <input class="form-control" th:field="*{name}" placeholder="Tên loại">
      <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="col-md-5"><input class="form-control" th:field="*{description}" placeholder="Mô tả"></div>
    <div class="col-auto"><button class="btn btn-primary">Thêm</button></div>
  </form>
</body>
</html>
